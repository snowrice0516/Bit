<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輕鬆認字 - 可愛風版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', 微軟正黑體, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff5f7, #ffe8f0);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(255, 182, 193, 0.3);
            padding: 35px;
            margin-bottom: 20px;
            border: 4px solid #ff99bb;
            position: relative;
            overflow: hidden;
        }

        /* 可愛裝飾元素 */
        .cute-decoration {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 120px;
            height: 120px;
            opacity: 0.2;
            z-index: 0;
        }

        h1 {
            color: #ff6699;
            text-align: center;
            margin-bottom: 35px;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(255, 153, 204, 0.3);
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .cute-icon {
            width: 60px;
            height: 60px;
        }

        /* 按鈕樣式 - 可愛圓潤風格 */
        .btn {
            display: block;
            width: 100%;
            padding: 22px;
            margin: 15px 0;
            border: none;
            border-radius: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-weight: bold;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.1);
        }

        .btn-icon {
            width: 30px;
            height: 30px;
        }

        /* 馬卡龍配色按鈕 */
        .btn-pink {
            background: linear-gradient(135deg, #ff99bb, #ff6699);
            border: 3px solid #ffffff;
        }

        .btn-purple {
            background: linear-gradient(135deg, #cc99ff, #aa66ff);
            border: 3px solid #ffffff;
        }

        .btn-yellow {
            background: linear-gradient(135deg, #ffdd99, #ffcc66);
            color: #ff6699;
            border: 3px solid #ff6699;
        }

        .btn-green {
            background: linear-gradient(135deg, #99eebb, #66dd99);
            border: 3px solid #ffffff;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 8px 15px rgba(255, 153, 204, 0.2);
        }

        .btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.1);
        }

        /* 畫面切換 */
        .screen {
            display: none;
        }

        .active {
            display: block;
            animation: fadeIn 0.7s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 輸入區域 */
        .input-group {
            margin: 25px 0;
            position: relative;
            z-index: 1;
        }

        .vocab-type {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .type-btn {
            flex: 1;
            padding: 15px;
            border-radius: 50px;
            border: 3px solid #ff99bb;
            background: #ffffff;
            color: #ff6699;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .type-btn.active {
            background: #ff99bb;
            color: #ffffff;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-size: 1.4rem;
            color: #ff6699;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 22px;
            border: 4px solid #ff99bb;
            border-radius: 20px;
            font-size: 1.6rem;
            outline: none;
            transition: all 0.3s ease;
            background: #fff5f7;
        }

        input:focus {
            border-color: #aa66ff;
            box-shadow: 0 0 0 5px rgba(255, 153, 204, 0.15);
        }

        /* 大字報詞彙卡片 - 可愛風 */
        .vocab-card {
            background: linear-gradient(135deg, #ff99bb, #ff6699);
            border-radius: 30px;
            padding: 50px 25px;
            margin: 35px 0;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 153, 204, 0.3);
            border: 5px solid #ffffff;
            position: relative;
            z-index: 1;
        }

        .vocab-display {
            font-size: 6.5rem; /* 超大字體 - 大字報效果 */
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            line-height: 1.2;
        }

        .vocab-type-label {
            font-size: 1.8rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* 操作按鈕 */
        .action-btns {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            position: relative;
            z-index: 1;
        }

        .action-btn {
            flex: 1;
            padding: 25px;
            border-radius: 50px;
            border: 4px solid #ffffff;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .correct-btn {
            background-color: #99eebb;
            color: white;
        }

        .wrong-btn {
            background-color: #ff99bb;
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 15px rgba(255, 153, 204, 0.2);
        }

        /* 詞彙列表 */
        .vocab-list {
            margin: 25px 0;
            max-height: 480px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .vocab-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(135deg, #fff5f7, #ffe8f0);
            border-radius: 20px;
            padding: 20px;
            margin: 12px 0;
            border: 3px solid #ff99bb;
        }

        .vocab-text {
            flex: 1;
        }

        .vocab-text strong {
            font-size: 1.6rem;
            color: #ff6699;
        }

        .vocab-text .type-tag {
            font-size: 1rem;
            color: #ffffff;
            background: #ff99bb;
            padding: 4px 10px;
            border-radius: 20px;
            margin-left: 10px;
        }

        .edit-btn, .delete-btn {
            padding: 12px 20px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .edit-btn {
            background-color: #ffdd99;
            color: #ff6699;
        }

        .delete-btn {
            background-color: #ff99bb;
            color: white;
        }

        /* 成功提示畫面 - 可愛風 */
        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 245, 247, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        .success-content {
            background: white;
            border-radius: 40px;
            padding: 50px 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 8px solid #ff99bb;
            box-shadow: 0 15px 50px rgba(255, 153, 204, 0.3);
        }

        .success-avatar {
            width: 150px;
            height: 150px;
            margin: 0 auto 25px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #ffdd99;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ff99bb;
        }

        .success-icon {
            width: 120px;
            height: 120px;
        }

        .success-title {
            font-size: 2.5rem;
            color: #ff6699;
            margin-bottom: 15px;
        }

        .success-message {
            font-size: 1.5rem;
            color: #ff6699;
            margin-bottom: 30px;
        }

        .success-btn {
            padding: 15px 40px;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #ff99bb, #ff6699);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            border: 3px solid white;
        }

        /* 滾動條樣式 - 可愛風 */
        ::-webkit-scrollbar {
            width: 15px;
        }

        ::-webkit-scrollbar-track {
            background: #ffe8f0;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff99bb;
            border-radius: 10px;
            border: 3px solid #ffe8f0;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff6699;
        }

        /* 響應式調整 */
        @media (max-width: 768px) {
            .vocab-display {
                font-size: 4.5rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .btn {
                font-size: 1.2rem;
                padding: 18px;
            }
            .action-btn {
                font-size: 1.4rem;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .vocab-display {
                font-size: 3.5rem;
            }
            .container {
                padding: 20px;
            }
            .success-avatar {
                width: 120px;
                height: 120px;
            }
            .success-icon {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 可愛裝飾 SVG -->
        <div class="cute-decoration">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="#ff99bb"/>
                <circle cx="35" cy="40" r="8" fill="white"/>
                <circle cx="65" cy="40" r="8" fill="white"/>
                <path d="M30 65 Q50 80 70 65" stroke="white" stroke-width="6" fill="none"/>
            </svg>
        </div>

        <h1>
            <!-- 可愛星星圖標 -->
            <svg class="cute-icon" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                <circle cx="30" cy="30" r="28" fill="#ffdd99"/>
                <path d="M30 10 L36 22 L48 25 L40 38 L42 50 L30 45 L18 50 L20 38 L12 25 L24 22 Z" fill="white"/>
            </svg>
            輕鬆認字
        </h1>

        <!-- 主頁面 -->
        <div id="home-screen" class="screen active">
            <button class="btn btn-pink" onclick="showScreen('add-vocab-screen')">
                <svg class="btn-icon" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="15" cy="15" r="12" fill="white"/>
                    <path d="M15 10 V20 M10 15 H20" stroke="#ff6699" stroke-width="3" stroke-linecap="round"/>
                </svg>
                添加新詞彙
            </button>
            <button class="btn btn-purple" onclick="startLearning()">
                <svg class="btn-icon" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="15" cy="15" r="12" fill="white"/>
                    <path d="M10 15 L20 10 L20 20 Z" fill="#aa66ff"/>
                </svg>
                開始學習
            </button>
            <button class="btn btn-yellow" onclick="showScreen('edit-vocab-screen')">
                <svg class="btn-icon" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="15" cy="15" r="12" fill="#ff6699"/>
                    <path d="M8 22 L12 18 L22 8 L18 12 Z" fill="white"/>
                    <path d="M10 10 L15 15" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
                編輯已儲存詞彙
            </button>
            <button class="btn btn-green" onclick="restartGame()">
                <svg class="btn-icon" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="15" cy="15" r="12" fill="white"/>
                    <path d="M15 8 L20 15 L15 22" stroke="#66dd99" stroke-width="3" stroke-linecap="round"/>
                    <path d="M10 15 A5 5 0 0 1 15 8" stroke="#66dd99" stroke-width="3" fill="none" stroke-linecap="round"/>
                </svg>
                重新開始遊戲
            </button>
        </div>

        <!-- 添加新詞彙頁面 -->
        <div id="add-vocab-screen" class="screen">
            <h2 style="text-align: center; margin-bottom: 30px; color: #ff6699; font-size: 2.2rem;">✨ 添加新詞彙</h2>
            
            <div class="vocab-type">
                <button class="type-btn active" id="type-zh" onclick="selectVocabType('zh')">中文詞彙</button>
                <button class="type-btn" id="type-en" onclick="selectVocabType('en')">英文詞彙</button>
            </div>
            
            <div class="input-group">
                <label for="vocab-content">詞彙內容</label>
                <input type="text" id="vocab-content" placeholder="請輸入詞彙內容..." required>
            </div>
            
            <button class="btn btn-pink" onclick="saveVocab()">儲存詞彙</button>
            <button class="btn btn-green" onclick="showScreen('home-screen')">返回主頁</button>
        </div>

        <!-- 開始學習頁面 (大字報模式) -->
        <div id="learn-screen" class="screen">
            <h2 style="text-align: center; margin-bottom: 30px; color: #ff6699; font-size: 2.2rem;">📚 開心學習時間</h2>
            
            <div class="vocab-card" id="current-vocab">
                <div class="vocab-type-label" id="vocab-type-display">中文詞彙</div>
                <div class="vocab-display" id="vocab-content-display">-</div>
            </div>
            
            <div class="action-btns">
                <button class="action-btn correct-btn" onclick="markCorrect()">🥰 認識</button>
                <button class="action-btn wrong-btn" onclick="markWrong()">😥 不認識</button>
            </div>
            
            <button class="btn btn-green" style="margin-top: 25px;" onclick="showScreen('home-screen')">返回主頁</button>
        </div>

        <!-- 編輯詞彙頁面 -->
        <div id="edit-vocab-screen" class="screen">
            <h2 style="text-align: center; margin-bottom: 30px; color: #ff6699; font-size: 2.2rem;">✏️ 編輯我的詞彙庫</h2>
            <div class="vocab-list" id="vocab-list">
                <!-- 已儲存詞彙將顯示在這裡 -->
            </div>
            <button class="btn btn-yellow" onclick="showScreen('home-screen')">退出返回主頁</button>
        </div>
    </div>

    <!-- 成功提示彈窗 -->
    <div id="success-modal" class="success-modal" style="display: none;">
        <div class="success-content">
            <div class="success-avatar" id="success-avatar">
                <!-- 隨機更換的可愛鼓勵 SVG 圖標 -->
            </div>
            <h3 class="success-title">太棒了！🥳</h3>
            <p class="success-message" id="success-text">所有詞彙都學會了！</p>
            <button class="success-btn" onclick="closeSuccessModal()">返回主頁</button>
        </div>
    </div>

    <script>
        // 全局變量
        let vocabList = JSON.parse(localStorage.getItem('cuteVocabList')) || [];
        let learningList = [];
        let currentVocab = null;
        let selectedVocabType = 'zh'; // 默認選擇中文
        
        // 可愛鼓勵圖標庫 (內嵌SVG)
        const encouragementIcons = [
            { 
                svg: `<svg class="success-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="#ff99bb"/>
                    <circle cx="35" cy="40" r="10" fill="white"/>
                    <circle cx="65" cy="40" r="10" fill="white"/>
                    <circle cx="38" cy="40" r="3" fill="#ff99bb"/>
                    <circle cx="68" cy="40" r="3" fill="#ff99bb"/>
                    <path d="M30 65 Q50 80 70 65" stroke="white" stroke-width="8" fill="none"/>
                </svg>`,
                text: '你超棒的！繼續加油💖' 
            },
            { 
                svg: `<svg class="success-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="#ffdd99"/>
                    <path d="M30 50 L45 65 L70 40" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <circle cx="50" cy="35" r="8" fill="white"/>
                </svg>`,
                text: '學習小達人🌟 太厲害了！' 
            },
            { 
                svg: `<svg class="success-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="30" width="80" height="40" rx="20" fill="#99eebb"/>
                    <path d="M30 50 L45 65 L75 35" stroke="white" stroke-width="10" fill="none" stroke-linecap="round"/>
                </svg>`,
                text: '全部都學會了🥳 超厲害！' 
            },
            { 
                svg: `<svg class="success-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="50 10, 90 40, 90 80, 50 60, 10 80, 10 40" fill="#ffdd99"/>
                    <circle cx="50" cy="50" r="15" fill="white"/>
                    <text x="50" y="55" text-anchor="middle" font-size="20" fill="#ff6699" font-weight="bold">1</text>
                </svg>`,
                text: '冠軍就是你🏆 超級棒！' 
            },
            { 
                svg: `<svg class="success-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="#cc99ff"/>
                    <path d="M30 40 Q50 20 70 40" stroke="white" stroke-width="6" fill="none"/>
                    <path d="M30 60 Q50 80 70 60" stroke="white" stroke-width="6" fill="none"/>
                </svg>`,
                text: '認字小高手✨ 繼續保持！' 
            }
        ];

        // 切換詞彙類型
        function selectVocabType(type) {
            selectedVocabType = type;
            
            // 更新按鈕樣式
            document.getElementById('type-zh').classList.remove('active');
            document.getElementById('type-en').classList.remove('active');
            document.getElementById(`type-${type}`).classList.add('active');
            
            // 更新輸入框提示
            const placeholder = type === 'zh' ? '請輸入中文詞彙（例如：蘋果）' : '請輸入英文詞彙（例如：apple）';
            document.getElementById('vocab-content').placeholder = placeholder;
        }

        // 切換畫面
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            
            // 加載編輯頁面的詞彙列表
            if (screenId === 'edit-vocab-screen') {
                loadVocabList();
            }
        }

        // 儲存新詞彙
        function saveVocab() {
            const content = document.getElementById('vocab-content').value.trim();
            
            if (content) {
                // 添加詞彙數據
                vocabList.push({ 
                    id: Date.now(), 
                    type: selectedVocabType, // zh=中文, en=英文
                    content: content,
                    createTime: new Date().toLocaleString()
                });
                
                // 儲存到本地
                localStorage.setItem('cuteVocabList', JSON.stringify(vocabList));
                
                // 清空輸入框
                document.getElementById('vocab-content').value = '';
                
                alert('✨ 詞彙儲存成功！你真棒～');
            } else {
                alert('😯 請輸入詞彙內容～');
            }
        }

        // 加載詞彙列表 (編輯頁面)
        function loadVocabList() {
            const vocabListElement = document.getElementById('vocab-list');
            vocabListElement.innerHTML = '';
            
            if (vocabList.length === 0) {
                vocabListElement.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #ff99bb; font-size: 1.4rem;">
                        📭 還沒有儲存任何詞彙哦～趕快添加吧！
                    </div>
                `;
                return;
            }
            
            // 遍歷顯示所有詞彙
            vocabList.forEach(vocab => {
                const item = document.createElement('div');
                item.className = 'vocab-item';
                
                const typeText = vocab.type === 'zh' ? '中文' : '英文';
                const typeColor = vocab.type === 'zh' ? '#ff99bb' : '#cc99ff';
                
                item.innerHTML = `
                    <div class="vocab-text">
                        <strong>${vocab.content}</strong>
                        <span class="type-tag" style="background: ${typeColor}">${typeText}</span>
                    </div>
                    <button class="edit-btn" onclick="editVocab(${vocab.id})">編輯</button>
                    <button class="delete-btn" onclick="deleteVocab(${vocab.id})">刪除</button>
                `;
                vocabListElement.appendChild(item);
            });
        }

        // 編輯詞彙
        function editVocab(id) {
            const vocabIndex = vocabList.findIndex(item => item.id === id);
            if (vocabIndex !== -1) {
                const vocab = vocabList[vocabIndex];
                
                const newContent = prompt(`編輯${vocab.type === 'zh' ? '中文' : '英文'}詞彙：`, vocab.content);
                
                if (newContent && newContent.trim()) {
                    vocabList[vocabIndex].content = newContent.trim();
                    
                    // 更新本地儲存
                    localStorage.setItem('cuteVocabList', JSON.stringify(vocabList));
                    
                    // 重新加載列表
                    loadVocabList();
                    
                    alert('✏️ 詞彙編輯成功！');
                } else if (newContent !== null) {
                    alert('😯 請輸入有效的詞彙內容～');
                }
            }
        }

        // 刪除詞彙
        function deleteVocab(id) {
            if (confirm('⚠️ 確定要刪除這個詞彙嗎？')) {
                vocabList = vocabList.filter(item => item.id !== id);
                
                // 更新本地儲存
                localStorage.setItem('cuteVocabList', JSON.stringify(vocabList));
                
                // 重新加載列表
                loadVocabList();
            }
        }

        // 開始學習
        function startLearning() {
            if (vocabList.length === 0) {
                alert('📚 還沒有添加任何詞彙哦～先添加詞彙再開始學習吧！');
                return;
            }
            
            // 初始化學習列表
            learningList = [...vocabList];
            
            // 顯示第一個隨機詞彙
            showNextVocab();
            
            // 切換到學習畫面
            showScreen('learn-screen');
        }

        // 顯示下一個隨機詞彙 (大字報模式)
        function showNextVocab() {
            // 檢查是否所有詞彙都學會了
            if (learningList.length === 0) {
                showSuccessModal();
                return;
            }
            
            // 隨機選擇一個詞彙
            const randomIndex = Math.floor(Math.random() * learningList.length);
            currentVocab = learningList[randomIndex];
            
            // 更新顯示內容
            document.getElementById('vocab-type-display').textContent = currentVocab.type === 'zh' ? '中文詞彙' : '英文詞彙';
            document.getElementById('vocab-content-display').textContent = currentVocab.content;
        }

        // 標記為已認識
        function markCorrect() {
            // 從學習列表中移除當前詞彙
            learningList = learningList.filter(item => item.id !== currentVocab.id);
            
            // 顯示下一個詞彙
            showNextVocab();
        }

        // 標記為不認識
        function markWrong() {
            // 直接顯示下一個隨機詞彙 (當前詞彙保留在列表中)
            showNextVocab();
        }

        // 重新開始遊戲
        function restartGame() {
            if (vocabList.length === 0) {
                alert('📚 還沒有添加任何詞彙哦～先添加詞彙再開始學習吧！');
                return;
            }
            
            // 重置學習列表
            learningList = [...vocabList];
            
            // 顯示新的隨機詞彙
            showNextVocab();
            
            // 切換到學習畫面
            showScreen('learn-screen');
            
            alert('🔄 重新開始學習啦！加油加油～');
        }

        // 顯示成功鼓勵彈窗
        function showSuccessModal() {
            // 隨機選擇一個鼓勵圖標和文字
            const randomIdx = Math.floor(Math.random() * encouragementIcons.length);
            const encouragement = encouragementIcons[randomIdx];
            
            // 更新彈窗內容
            document.getElementById('success-avatar').innerHTML = encouragement.svg;
            document.getElementById('success-text').textContent = encouragement.text;
            
            // 顯示彈窗
            document.getElementById('success-modal').style.display = 'flex';
        }

        // 關閉成功彈窗
        function closeSuccessModal() {
            document.getElementById('success-modal').style.display = 'none';
            showScreen('home-screen');
        }

        // 頁面加載初始化
        window.onload = function() {
            // 從本地儲存加載詞彙數據
            vocabList = JSON.parse(localStorage.getItem('cuteVocabList')) || [];
            
            // 初始化詞彙類型選擇
            selectVocabType('zh');
        };
    </script>
</body>
</html>
